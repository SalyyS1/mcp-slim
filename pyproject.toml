[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-slim"
version = "0.5.0"
description = "Zero-config MCP proxy that cuts tool schema & output token usage by 60-80% and redacts leaked secrets in real time for Claude Code, Cursor & Windsurf."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SalyyS1", email = "121370214+SalyyS1@users.noreply.github.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude-code",
    "cursor",
    "llm",
    "token-optimization",
    "context-compression",
    "secret-redaction",
    "ai-agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-slim = "mcp_slim.cli:main"

[project.urls]
Homepage = "https://github.com/SalyyS1/mcp-slim"
Repository = "https://github.com/SalyyS1/mcp-slim"
Issues = "https://github.com/SalyyS1/mcp-slim/issues"
