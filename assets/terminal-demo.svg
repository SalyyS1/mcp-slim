      .cmd { fill: #f0f6fc; font-weight: 600; }
      .prompt { fill: #3fb950; font-weight: 700; }
      .muted { fill: #8b949e; }
      .cyan { fill: #58a6ff; }
      .green { fill: #3fb950; font-weight: 600; }
      .amber { fill: #d29922; font-weight: 600; }
      .red { fill: #f85149; font-weight: 600; }
      .purple { fill: #bc8cff; font-weight: 600; }
    </style>
  </defs>

  <rect width="920" height="470" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="920" height="38" rx="12" fill="#161b22"/>
