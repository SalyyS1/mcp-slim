<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 398" width="100%">
  <style>
    .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1px; }
    .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .label { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sublabel { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .val { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #58a6ff; }
    .val-p99 { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8b949e; }
    .throughput { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #3fb950; }
    .grid { stroke: #21262d; stroke-width: 1px; stroke-dasharray: 3,3; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="397"/>
  <text class="title" x="24" y="34">mcp-slim Processing Latency &amp; Throughput (N = 5,000 JSON-RPC Messages)</text>
  <text class="subtitle" x="24" y="54">Per-message processing latency in microseconds (p50 vs. p99, sub-millisecond overhead)</text>
  <rect x="24" y="66" width="12" height="12" rx="2" fill="#1f6feb"/>
  <text class="sublabel" x="42" y="76">p50 Median Latency (us)</text>
  <rect x="195" y="66" width="12" height="12" rx="2" fill="#388bfd" fill-opacity="0.35"/>
  <text class="sublabel" x="213" y="76">p99 Tail Latency (us)</text>
  <line class="grid" x1="275" y1="86" x2="275" y2="358"/>
  <text class="sublabel" x="275" y="382" text-anchor="middle">0 us</text>
  <line class="grid" x1="339" y1="86" x2="339" y2="358"/>
  <text class="sublabel" x="339" y="382" text-anchor="middle">330 us</text>
  <line class="grid" x1="403" y1="86" x2="403" y2="358"/>
  <text class="sublabel" x="403" y="382" text-anchor="middle">661 us</text>
  <line class="grid" x1="467" y1="86" x2="467" y2="358"/>
  <text class="sublabel" x="467" y="382" text-anchor="middle">991 us</text>
  <line class="grid" x1="531" y1="86" x2="531" y2="358"/>
  <text class="sublabel" x="531" y="382" text-anchor="middle">1322 us</text>
  <line class="grid" x1="595" y1="86" x2="595" y2="358"/>
  <text class="sublabel" x="595" y="382" text-anchor="middle">1652 us</text>
  <text class="label" x="24" y="118">SecretGuard.redact_text</text>
  <text class="sublabel" x="24" y="136">7,450 B JSON-RPC payload (12 rules)</text>
  <rect x="275" y="108" width="49" height="22" rx="3" fill="#388bfd" fill-opacity="0.30"/>
  <rect x="275" y="108" width="32" height="22" rx="3" fill="#1f6feb"/>
  <text class="val" x="332" y="123">p50: 169.3 us</text>
  <text class="val-p99" x="420" y="123">(p99: 256.8 us)</text>
  <text class="throughput" x="836" y="123" text-anchor="end">5,910 msg/s</text>
  <text class="label" x="24" y="182">SchemaSlimmer.slim_tools_list</text>
  <text class="sublabel" x="24" y="200">mcp-server-git (14 tools, 7,639 B)</text>
  <rect x="275" y="172" width="179" height="22" rx="3" fill="#388bfd" fill-opacity="0.30"/>
  <rect x="275" y="172" width="136" height="22" rx="3" fill="#1f6feb"/>
  <text class="val" x="462" y="187">p50: 705.4 us</text>
  <text class="val-p99" x="550" y="187">(p99: 927.9 us)</text>
  <text class="throughput" x="836" y="187" text-anchor="end">1,408 msg/s</text>
  <text class="label" x="24" y="246">OutputSlimmer.slim_call_result</text>
  <text class="sublabel" x="24" y="264">12-repo JSON result (3,940 B)</text>
  <rect x="275" y="236" width="134" height="22" rx="3" fill="#388bfd" fill-opacity="0.30"/>
  <rect x="275" y="236" width="89" height="22" rx="3" fill="#1f6feb"/>
  <text class="val" x="417" y="251">p50: 463.6 us</text>
  <text class="val-p99" x="505" y="251">(p99: 694.9 us)</text>
  <text class="throughput" x="836" y="251" text-anchor="end">2,113 msg/s</text>
  <text class="label" x="24" y="310">MCPProxy Full JSON-RPC Turn</text>
  <text class="sublabel" x="24" y="328">Request + Response + Slim + Guard</text>
  <rect x="275" y="300" width="278" height="22" rx="3" fill="#388bfd" fill-opacity="0.30"/>
  <rect x="275" y="300" width="190" height="22" rx="3" fill="#1f6feb"/>
  <text class="val" x="561" y="315">p50: 984.5 us</text>
  <text class="val-p99" x="649" y="315">(p99: 1436.7 us)</text>
  <text class="throughput" x="836" y="315" text-anchor="end">1,009 msg/s</text>
</svg>
