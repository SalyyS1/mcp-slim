<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 488" width="100%">
  <style>
    .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1px; }
    .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .label { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sublabel { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .val { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #e6edf3; }
    .val-dim { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8b949e; }
    .badge { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #3fb950; }
    .grid { stroke: #21262d; stroke-width: 1px; stroke-dasharray: 3,3; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="487"/>
  <text class="title" x="24" y="34">MCP Context Token Consumption: Raw Upstream vs. mcp-slim</text>
  <text class="subtitle" x="24" y="54">Measured on 60 real MCP tool definitions + JSON tool outputs (cl100k_base token scale, lower is better)</text>
  <rect x="24" y="68" width="12" height="12" rx="2" fill="#30363d"/>
  <text class="sublabel" x="42" y="78">Upstream MCP (Raw)</text>
  <rect x="170" y="68" width="12" height="12" rx="2" fill="#238636"/>
  <text class="sublabel" x="188" y="78">With mcp-slim Proxy</text>
  <line class="grid" x1="265" y1="90" x2="265" y2="446"/>
  <text class="sublabel" x="265" y="470" text-anchor="middle">0 tok</text>
  <line class="grid" x1="347" y1="90" x2="347" y2="446"/>
  <text class="sublabel" x="347" y="470" text-anchor="middle">2,873 tok</text>
  <line class="grid" x1="429" y1="90" x2="429" y2="446"/>
  <text class="sublabel" x="429" y="470" text-anchor="middle">5,746 tok</text>
  <line class="grid" x1="511" y1="90" x2="511" y2="446"/>
  <text class="sublabel" x="511" y="470" text-anchor="middle">8,618 tok</text>
  <line class="grid" x1="593" y1="90" x2="593" y2="446"/>
  <text class="sublabel" x="593" y="470" text-anchor="middle">11,491 tok</text>
  <line class="grid" x1="675" y1="90" x2="675" y2="446"/>
  <text class="sublabel" x="675" y="470" text-anchor="middle">14,364 tok</text>
  <text class="label" x="24" y="120">mcp-server-git (14 tools)</text>
  <text class="sublabel" x="24" y="138">7,639 B -&gt; 3,959 B wire</text>
  <rect x="265" y="106" width="54" height="18" rx="3" fill="#30363d"/>
  <text class="val-dim" x="327" y="119">1,910 tok</text>
  <rect x="265" y="128" width="28" height="18" rx="3" fill="#238636"/>
  <text class="val" x="301" y="141">990 tok</text>
  <text class="badge" x="836" y="131" text-anchor="end">-48.2%</text>
  <text class="label" x="24" y="188">mcp-server-filesystem (12 tools)</text>
  <text class="sublabel" x="24" y="206">8,017 B -&gt; 3,883 B wire</text>
  <rect x="265" y="174" width="57" height="18" rx="3" fill="#30363d"/>
  <text class="val-dim" x="330" y="187">2,005 tok</text>
  <rect x="265" y="196" width="27" height="18" rx="3" fill="#238636"/>
  <text class="val" x="300" y="209">971 tok</text>
  <text class="badge" x="836" y="199" text-anchor="end">-51.6%</text>
  <text class="label" x="24" y="256">mcp-server-postgres (8 tools)</text>
  <text class="sublabel" x="24" y="274">5,069 B -&gt; 2,595 B wire</text>
  <rect x="265" y="242" width="36" height="18" rx="3" fill="#30363d"/>
  <text class="val-dim" x="309" y="255">1,268 tok</text>
  <rect x="265" y="264" width="18" height="18" rx="3" fill="#238636"/>
  <text class="val" x="291" y="277">648 tok</text>
  <text class="badge" x="836" y="267" text-anchor="end">-48.9%</text>
  <text class="label" x="24" y="324">mcp-server-github (26 tools)</text>
  <text class="sublabel" x="24" y="342">29,323 B -&gt; 15,453 B wire</text>
  <rect x="265" y="310" width="209" height="18" rx="3" fill="#30363d"/>
  <text class="val-dim" x="482" y="323">7,331 tok</text>
  <rect x="265" y="332" width="110" height="18" rx="3" fill="#238636"/>
  <text class="val" x="383" y="345">3,864 tok</text>
  <text class="badge" x="836" y="335" text-anchor="end">-47.3%</text>
  <text class="label" x="24" y="392">Combined Workspace (60 tools + call)</text>
  <text class="sublabel" x="24" y="410">57,470 B -&gt; 29,438 B wire</text>
  <rect x="265" y="378" width="410" height="18" rx="3" fill="#30363d"/>
  <text class="val-dim" x="683" y="391">14,364 tok</text>
  <rect x="265" y="400" width="209" height="18" rx="3" fill="#238636"/>
  <text class="val" x="482" y="413">7,354 tok</text>
  <text class="badge" x="836" y="403" text-anchor="end">-48.8%</text>
</svg>
